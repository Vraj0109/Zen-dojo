<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, Expressive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{root}}">
  <div aria-hidden="true" style="{{blob1}}"></div>
  <div aria-hidden="true" style="{{blob2}}"></div>
  <div aria-hidden="true" style="{{blob3}}"></div>
  <section style="{{card}}">
    <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 61 13 75 10 80 24 94 30 90 44 98 56 87 66 88 80 74 83 66 95 52 90 38 96 30 84 16 81 15 67 4 57 12 44 8 30 22 24 27 10 41 12z" fill="#1E6B4A"/><text x="50" y="60" text-anchor="middle" font-family="Google Sans" font-size="28" font-weight="600" fill="#FFFFFF">ZD</text></svg>
    <h1 style="{{h1}}">Welcome back to the dojo</h1>
    <p style="margin: 0; font-size: 15px; color: #404943; text-align: center;">Sign in to sync your plan, solves and theme between the desktop app and the web.</p>
    <a href="#" style="{{gh}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>Continue with GitHub</a>
    <div style="display: flex; align-items: center; gap: 12px; width: 100%; color: #707971; font-size: 13px;"><span style="flex: 1; height: 1px; background: #DEE5DD;"></span>or<span style="flex: 1; height: 1px; background: #DEE5DD;"></span></div>
    <a href="#" style="{{local}}">Keep using it on this device only</a>
    <p style="margin: 0; font-size: 12px; color: #404943; text-align: center;">We only read your GitHub name and avatar.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const ph = !!this.props.phone;
return {
root: 'box-sizing: border-box; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #F6FBF5; color: #171D19; font-family: \'Google Sans\', system-ui, sans-serif; padding: 16px; ' + (ph ? 'width: 390px; height: 844px;' : 'width: 100%; min-height: 900px;'),
blob1: 'position: absolute; width: ' + (ph ? '220px' : '420px') + '; height: ' + (ph ? '220px' : '420px') + '; top: -80px; left: -60px; border-radius: 42% 58% 60% 40%; background: #B6F1CF;',
blob2: 'position: absolute; width: ' + (ph ? '180px' : '320px') + '; height: ' + (ph ? '180px' : '320px') + '; bottom: -70px; right: -40px; border-radius: 999px; background: #FFDDB2;',
blob3: 'position: absolute; width: 140px; height: 140px; bottom: ' + (ph ? '120px' : '140px') + '; left: ' + (ph ? '-40px' : '12%') + '; border-radius: 32px; transform: rotate(18deg); background: #D6E3FF;',
card: 'position: relative; box-sizing: border-box; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: ' + (ph ? '28px 22px' : '40px 36px') + '; border-radius: 32px; background: #FFFFFF; border: 1px solid #DEE5DD; box-shadow: 0 4px 20px rgba(0,0,0,0.06);',
h1: 'margin: 0; font-size: ' + (ph ? '24px' : '28px') + '; font-weight: 600; text-align: center;',
gh: 'display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px; border-radius: 999px; background: #1E6B4A; color: #FFFFFF; font-size: 16px; font-weight: 500; text-decoration: none;',
local: 'display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 999px; border: 1px solid #707971; color: #1E6B4A; font-size: 15px; font-weight: 500; text-decoration: none;'
};
}
}
</script>
</body>
</html>
