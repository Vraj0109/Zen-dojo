<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backlog, Expressive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}sc-if,sc-for{display:contents}</style>
</helmet>
<div style="{{root}}">
  <sc-if value="{{desk}}" hint-placeholder-val="{{true}}"><dc-import name="XRail" active="Today" hint-size="96px,960px"></dc-import></sc-if>
  <main style="{{main}}">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;"><div><h1 style="{{h1}}">Backlog</h1><p style="{{muted}}">6 tasks from past weeks. Skipping never costs XP.</p></div><div style="display: flex; gap: 8px; flex-wrap: wrap;"><a href="#" style="{{outline}}">Shift the plan a week</a><a href="#" style="{{primary}}">Add 2 to today</a></div></header>
    <sc-for list="{{weeks}}" as="w" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <span style="{{weekChip}}">{{w.name}}</span>
        <sc-for list="{{w.items}}" as="t" hint-placeholder-count="3"><div style="{{t.row}}"><span style="{{t.shape}}"></span><div style="flex: 1; min-width: 0;"><p style="margin: 0; font-size: 16px; font-weight: 500;">{{t.name}}</p><p style="{{muted}}">{{t.meta}}</p></div><a href="#" style="{{tonal}}">Do today</a></div></sc-for>
      </section>
    </sc-for>
  </main>
  <sc-if value="{{ph}}" hint-placeholder-val="{{false}}"><dc-import name="XNavBar" active="Today" hint-size="390px,88px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const ph = !!this.props.phone;
const col = { dsa: ['#D6E3FF', '14px'], sd: ['#F0DBFF', '999px'], beh: ['#FFDDB2', '6px 22px'], lld: ['#BCEBEE', '22px 6px'], core: ['#D2E8D9', '18px'] };
const mk = (arr) => arr.map(([name, meta, s]) => ({ name, meta, row: 'display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #DEE5DD;', shape: 'width: 40px; height: 40px; flex: none; border-radius: ' + col[s][1] + '; background: ' + col[s][0] + ';' }));
return { ph, desk: !ph,
weeks: [{ name: 'Week 4', items: mk([['Binary search on the answer', 'DSA · 45 min · 12 days ago', 'dsa'], ['Design a news feed', 'System design · 75 min · 10 days ago', 'sd'], ['STAR story: conflict', 'Behavioural · 15 min', 'beh']]) }, { name: 'Week 5', items: mk(ph ? [['Strategy pattern: payments', 'LLD · 30 min', 'lld']] : [['Strategy pattern: payments', 'LLD · 30 min · 4 days ago', 'lld'], ['Read: virtual memory', 'Core CS · 20 min · 3 days ago', 'core']]) }],
root: 'box-sizing: border-box; display: flex; background: #F6FBF5; color: #171D19; font-family: \'Google Sans\', system-ui, sans-serif; ' + (ph ? 'flex-direction: column; width: 390px; height: 844px; overflow: hidden;' : 'width: 100%; height: 960px; overflow: hidden;'),
main: ph ? 'flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;' : 'flex: 1; min-width: 0; height: 100%; overflow-y: auto; box-sizing: border-box; scrollbar-width: thin; max-width: 1040px; padding: 28px 40px 40px 24px; display: flex; flex-direction: column; gap: 18px;',
h1: 'margin: 0; font-size: ' + (ph ? '28px' : '36px') + '; font-weight: 600;', muted: 'margin: 0; font-size: 14px; color: #404943;',
weekChip: 'align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: #EBF0EA; font-size: 13px; font-weight: 600;',
primary: 'display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #1E6B4A; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none;',
outline: 'display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #707971; color: #1E6B4A; font-size: 14px; font-weight: 500; text-decoration: none;',
tonal: 'display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #D2E8D9; color: #0D1F15; font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;'
};
}
}
</script>
</body>
</html>
