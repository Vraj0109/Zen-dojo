<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagrams, Expressive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}sc-if,sc-for{display:contents}</style>
</helmet>
<div style="{{root}}">
  <sc-if value="{{desk}}" hint-placeholder-val="{{true}}"><dc-import name="XRail" active="Learn" hint-size="96px,960px"></dc-import></sc-if>
  <main style="{{main}}">
    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;"><div><h1 style="{{h1}}">Your diagrams</h1><p style="{{muted}}">12 sketches · photos and drawings you saved while studying</p></div><a href="#" style="{{primary}}">Add a diagram</a></header>
    <section style="{{drop}}"><span style="{{dropIcon}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E6B4A" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span><div><p style="margin: 0; font-size: 16px; font-weight: 500;">Drop an image here, or paste one</p><p style="{{muted}}">PNG or JPG up to 5 MB. Link it to a lesson so it shows up there too.</p></div></section>
    <div style="{{grid}}">
      <sc-for list="{{items}}" as="d" hint-placeholder-count="6">
        <article style="{{card}}">
          <div style="{{d.thumb}}"><svg width="100%" height="100%" viewBox="0 0 200 110" preserveAspectRatio="xMidYMid meet"><rect x="14" y="40" width="44" height="30" rx="10" fill="#FFFFFF" stroke="{{d.ink}}" stroke-width="2"/><rect x="78" y="18" width="44" height="30" rx="10" fill="#FFFFFF" stroke="{{d.ink}}" stroke-width="2"/><rect x="78" y="62" width="44" height="30" rx="10" fill="#FFFFFF" stroke="{{d.ink}}" stroke-width="2"/><rect x="142" y="40" width="44" height="30" rx="15" fill="#FFFFFF" stroke="{{d.ink}}" stroke-width="2"/><path d="M58 55 78 33M58 55 78 77M122 33 142 55M122 77 142 55" stroke="{{d.ink}}" stroke-width="2" fill="none"/></svg></div>
          <p style="margin: 0; font-size: 16px; font-weight: 500;">{{d.name}}</p>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;"><span style="{{d.tag}}">{{d.subject}}</span><span style="font-size: 13px; color: #404943;">{{d.when}}</span></div>
        </article>
      </sc-for>
    </div>
  </main>
  <sc-if value="{{ph}}" hint-placeholder-val="{{false}}"><dc-import name="XNavBar" active="Learn" hint-size="390px,88px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const ph = !!this.props.phone;
const all = [['URL shortener: write path', 'System design', '#F0DBFF', '#56397A', '2 days ago'], ['LRU cache: list and map', 'DSA', '#D6E3FF', '#284777', '5 days ago'], ['Parking lot classes', 'LLD', '#BCEBEE', '1D4E51', '1 week ago'], ['Kafka partitions', 'System design', '#F0DBFF', '#56397A', '1 week ago'], ['Process states', 'Core CS', '#FFDDB2', '#8B5000', '2 weeks ago'], ['Union-find by rank', 'DSA', '#D6E3FF', '#284777', '3 weeks ago']];
return { ph, desk: !ph,
items: (ph ? all.slice(0, 2) : all).map(([name, subject, bg, ink, when]) => ({ name, subject, when, ink: ink.startsWith('#') ? ink : '#' + ink,
thumb: 'height: ' + (ph ? '150px' : '140px') + '; border-radius: 20px; background: ' + bg + '; padding: 8px; box-sizing: border-box;',
tag: 'padding: 4px 10px; border-radius: 999px; background: ' + bg + '; font-size: 12px; font-weight: 600;' })),
root: 'box-sizing: border-box; display: flex; background: #F6FBF5; color: #171D19; font-family: \'Google Sans\', system-ui, sans-serif; ' + (ph ? 'flex-direction: column; width: 390px; height: 844px; overflow: hidden;' : 'width: 100%; height: 960px; overflow: hidden;'),
main: ph ? 'flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;' : 'flex: 1; min-width: 0; height: 100%; overflow-y: auto; box-sizing: border-box; scrollbar-width: thin; max-width: 1160px; padding: 28px 40px 40px 24px; display: flex; flex-direction: column; gap: 16px;',
h1: 'margin: 0; font-size: ' + (ph ? '28px' : '36px') + '; font-weight: 600;', muted: 'margin: 4px 0 0; font-size: 14px; color: #404943;',
primary: 'display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #1E6B4A; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none;',
drop: 'display: flex; align-items: center; gap: 16px; padding: ' + (ph ? '16px' : '20px 24px') + '; border-radius: 28px; border: 2px dashed #8FD8B0; background: #FFFFFF;',
dropIcon: 'width: 48px; height: 48px; flex: none; border-radius: 16px; background: #D2E8D9; display: flex; align-items: center; justify-content: center;',
grid: 'display: grid; grid-template-columns: ' + (ph ? '1fr' : 'repeat(auto-fill, minmax(min(100%, 240px), 1fr))') + '; gap: 12px;',
card: 'display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 16px; border-radius: 28px; background: #FFFFFF; border: 1px solid #DEE5DD;'
};
}
}
</script>
</body>
</html>
