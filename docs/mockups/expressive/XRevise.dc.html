<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick revise, Expressive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}sc-if,sc-for{display:contents}</style>
</helmet>
<div style="{{root}}">
  <sc-if value="{{desk}}" hint-placeholder-val="{{true}}"><dc-import name="XRail" active="Review" hint-size="96px,960px"></dc-import></sc-if>
  <main style="{{main}}">
    <section style="{{hero}}">
      <div style="flex: 1 1 240px;"><p style="margin: 0; font-size: 14px; font-weight: 500; opacity: 0.85;">Interview on Friday, 4 December</p><h1 style="{{h1}}">16 days to go</h1></div>
      <a href="#" style="{{heroBtn}}">10-question quiz</a>
    </section>
    <h2 style="{{h2}}">Weak spots</h2>
    <div style="{{grid3}}">
      <sc-for list="{{weak}}" as="w" hint-placeholder-count="3"><section style="{{w.card}}"><span style="{{w.tag}}">{{w.subject}}</span><p style="margin: 0; font-size: 17px; font-weight: 500;">{{w.name}}</p><p style="margin: 0; font-size: 14px; opacity: 0.8;">{{w.why}}</p></section></sc-for>
    </div>
    <div style="{{grid2}}">
      <section style="{{card}}"><h2 style="{{h2}}">Last days</h2><sc-for list="{{plan}}" as="p" hint-placeholder-count="4"><div style="display: flex; gap: 12px; align-items: center;"><span style="{{p.day}}">{{p.d}}</span><span style="font-size: 15px;">{{p.t}}</span></div></sc-for></section>
      <section style="{{card}}"><h2 style="{{h2}}">Key numbers</h2><sc-for list="{{nums}}" as="n" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; font-size: 15px;"><span style="color: #404943;">{{n.k}}</span><span style="font-weight: 600;">{{n.v}}</span></div></sc-for></section>
    </div>
  </main>
  <sc-if value="{{ph}}" hint-placeholder-val="{{false}}"><dc-import name="XNavBar" active="Review" hint-size="390px,88px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const ph = !!this.props.phone;
return { ph, desk: !ph,
weak: [['DSA', 'Interval DP', '3 failed runs', '#D6E3FF', '#001B3E'], ['System design', 'Sharding', 'Quiz 2 of 5', '#F0DBFF', '#2A0E45'], ['Core CS', 'Isolation levels', 'Not seen for 18 days', '#FFDDB2', '#2C1600']].map(([subject, name, why, bg, fg]) => ({ subject, name, why, card: 'display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 28px; background: ' + bg + '; color: ' + fg + ';', tag: 'align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.6); font-size: 12px; font-weight: 600;' })),
plan: [['-3', 'Two mock interviews'], ['-2', 'Re-solve 10 starred problems'], ['-1', 'STAR stories aloud, then rest'], ['0', 'One easy warm-up, then go']].map(([d, t]) => ({ d, t, day: 'width: 44px; height: 44px; flex: none; border-radius: 16px; background: #D2E8D9; color: #0D1F15; display: flex; align-items: center; justify-content: center; font-weight: 600;' })),
nums: [['L1 cache read', '1 ns'], ['SSD random read', '100 µs'], ['Same-region round trip', '0.5 ms'], ['Seconds per day', '86,400']].map(([k, v]) => ({ k, v })),
root: 'box-sizing: border-box; display: flex; background: #F6FBF5; color: #171D19; font-family: \'Google Sans\', system-ui, sans-serif; ' + (ph ? 'flex-direction: column; width: 390px; height: 844px; overflow: hidden;' : 'width: 100%; height: 960px; overflow: hidden;'),
main: ph ? 'flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px;' : 'flex: 1; min-width: 0; height: 100%; overflow-y: auto; box-sizing: border-box; scrollbar-width: thin; max-width: 1120px; padding: 28px 40px 40px 24px; display: flex; flex-direction: column; gap: 16px;',
hero: 'display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: ' + (ph ? '20px' : '28px 32px') + '; border-radius: 32px; background: #1E6B4A; color: #FFFFFF;',
h1: 'margin: 4px 0 0; font-size: ' + (ph ? '30px' : '40px') + '; font-weight: 600;', h2: 'margin: 0; font-size: 20px; font-weight: 500;',
heroBtn: 'display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: #B6F1CF; color: #00210F; font-size: 15px; font-weight: 500; text-decoration: none;',
grid3: 'display: grid; grid-template-columns: ' + (ph ? '1fr' : 'repeat(auto-fill, minmax(min(100%, 220px), 1fr))') + '; gap: 12px;',
grid2: 'display: grid; grid-template-columns: ' + (ph ? '1fr' : 'repeat(auto-fill, minmax(min(100%, 300px), 1fr))') + '; gap: 12px;',
card: 'display: flex; flex-direction: column; gap: 12px; padding: 22px; border-radius: 28px; background: #FFFFFF; border: 1px solid #DEE5DD;'
};
}
}
</script>
</body>
</html>
