name: Desktop app

# Builds the installers on each OS (the bundled SQLite driver is native, so each OS builds its own).
#   - Run it by hand from the Actions tab: installers are attached to the run as artifacts.
#   - Push a tag like v0.2.0: installers are also published as a GitHub release, and installed apps
#     update themselves from it (latest*.yml + .blockmap files are what electron-updater reads).
#     The tag must match "version" in apps/desktop/package.json.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so the Mac build is arm64.
        os: [windows-latest, macos-latest, ubuntu-latest]
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # No signing certificates: skip looking for them in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Hand-written notes live in docs/releases/<tag>.md; GitHub's generated list of changes is added below them.
      - name: Release notes
        run: |
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" release-notes.md
          else
            echo "No hand-written notes for $GITHUB_REF_NAME." > release-notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          body_path: release-notes.md
          generate_release_notes: true
