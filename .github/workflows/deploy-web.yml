name: Deploy hosted web app

# Builds apps/web for Cloudflare Workers (OpenNext) and deploys it as the Worker "zen-dojo-web".
# Runs on a manual dispatch, on a tag named web-v*, or on a push to main that touches the web app.
# Every value comes from GitHub secrets or repository variables; nothing secret is in the repo.

on:
  push:
    branches: [main]
    tags: ["web-v*"]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip quietly until the repository variable HOSTED_WEB_ENABLED is set to "true" (Settings > Variables).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HOSTED_WEB_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HABIT_HOSTED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the Cloudflare bundle
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy the Worker
        working-directory: apps/web
        run: >
          pnpm exec opennextjs-cloudflare deploy --
          --var SYNC_WORKER_URL:${{ vars.SYNC_WORKER_URL }}
